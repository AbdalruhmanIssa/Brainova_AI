name: Trigger auto deployment for brainova-ai

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/brainova-ai-AutoDeployTrigger-409830ea-ec02-4a7a-8bc4-93e60c532216.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BRAINOVAAI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BRAINOVAAI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BRAINOVAAI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: brainovaacr2026.azurecr.io
          registryUsername: ${{ secrets.BRAINOVAAI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BRAINOVAAI_REGISTRY_PASSWORD }}
          containerAppName: brainova-ai
          resourceGroup: brainova-ai
          imageToBuild: brainovaacr2026.azurecr.io/brainova-ai:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


