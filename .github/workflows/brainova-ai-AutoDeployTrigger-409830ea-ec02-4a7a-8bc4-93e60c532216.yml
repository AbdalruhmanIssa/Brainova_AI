name: Trigger auto deployment for brainova-ai

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BRAINOVAAI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BRAINOVAAI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BRAINOVAAI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: brainovaacr2026.azurecr.io
          registryUsername: ${{ secrets.BRAINOVAAI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BRAINOVAAI_REGISTRY_PASSWORD }}
          containerAppName: brainova-ai
          resourceGroup: brainova-ai
          imageToBuild: brainovaacr2026.azurecr.io/brainova-ai:${{ github.sha }}
          targetPort: 8080
          environmentVariables: MODEL_BLOB_URL=https://brainovamodels2026.blob.core.windows.net/models/brainova_model.keras
